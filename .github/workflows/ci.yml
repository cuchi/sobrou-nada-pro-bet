name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: snpb
          POSTGRES_PASSWORD: snpb
          POSTGRES_DB: snpb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://snpb:snpb@localhost:5432/snpb
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      GOOGLE_CLIENT_ID: ci-test-client-id
      ADMIN_TOKEN: ci-test-admin-token
      ODDS_API_KEY: ci-test-odds-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Build backend
        working-directory: backend
        run: cargo build --release

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test backend
        working-directory: backend
        run: cargo nextest run

      - name: Install llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage (summary)
        working-directory: backend
        run: cargo llvm-cov --summary-only

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 requires Node ^20.19 || >=22.12. Pin to 22 LTS so the
          # toolchain satisfies the engine spec without tracking 20.x patches.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ci-test-client-id

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run
