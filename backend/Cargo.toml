[package]
name = "sobrou-nada-pro-bet"
version = "0.1.0"
edition = "2024"
default-run = "sobrou-nada-pro-bet"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
dotenvy = "0.15"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
rand = "0.10"

[dev-dependencies]
tower = "0.5"
