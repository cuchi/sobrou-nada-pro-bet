<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6 16 14" role="img" aria-label="Sobrou Nada Pro Bet">
  <!-- Yellow outline trophy on transparent background. -->
  <g fill="none" stroke="#E1B12C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cup. -->
    <path d="M 7 7 L 17 7 L 16 14 Q 15.8 15 14.8 15 L 9.2 15 Q 8.2 15 8 14 Z"/>
    <!-- Left handle. -->
    <path d="M 7 8.4 Q 5 8.6 5 10.4 Q 5 12 7 12.4"/>
    <!-- Right handle. -->
    <path d="M 17 8.4 Q 19 8.6 19 10.4 Q 19 12 17 12.4"/>
    <!-- Stem. -->
    <path d="M 12 15 L 12 17.6"/>
    <!-- Base. -->
    <path d="M 9 19 L 15 19 M 9.6 17.6 L 14.4 17.6"/>
  </g>

  <!-- The crack: a jagged slit pushed to the right side of the cup, off
       the vertical centerline so it reads as a fracture, not a shine. -->
  <path
    d="M 14 7.6 L 13 9.4 L 14.4 11 L 13.2 13 L 14.6 14.6"
    fill="none"
    stroke="#E1B12C"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>