services:
  postgres:
    image: postgres:17-alpine
    container_name: snpb-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: snpb
      POSTGRES_PASSWORD: snpb
      POSTGRES_DB: snpb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
